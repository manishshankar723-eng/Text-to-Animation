# =============================================================================
# CHARACTER ASSET GENERATION — GEMINI PROMPTS
# =============================================================================
# HOW TO USE:
#   - {age}, {gender}, {skin_tone} placeholders are used in fullbody, hair, face only.
#   - These are filled at runtime from the character template config below.
#   - All other part prompts are generic (no character-specific placeholders).
#
# HOW TO CUSTOMIZE:
#   - Replace the prompt text below with your own tuned prompts.
#   - Keep the YAML key names exactly as they are.
#   - The pipeline reads these keys to decide which Gemini calls to make.
#
# PROMPT RULES (applied in every prompt below):
#   1. Position = priority. The MOST important instruction is the FIRST sentence.
#   2. "COPY, not create" — preserves identity from the reference image.
#   3. Positive phrasing — describe what you WANT, not long NO-lists.
#   4. Every prompt states: 2×2 grid, four views, pure white background.
#   5. Age and gender stated clearly (in character-specific prompts).
# =============================================================================

# ---------------------------------------------------------------------------
# DEFAULT PROMPTS — used when no template override exists for a part.
# These are DRAFT prompts based on the prompt rules. Replace with your
# own tuned prompts. The pipeline will use these as-is until you do.
# ---------------------------------------------------------------------------
defaults:

  fullbody: >
    COPY this exact character EXACTLY as shown in the reference image — keep the SAME gender/sex, age,
    face, hairstyle, body type, outfit and skin tone. Do NOT change their identity, gender or age; if
    the reference is a woman keep her a woman, if a man keep him a man. Lay the sheet out as EXACTLY
    TWO ROWS and TWO COLUMNS — four equal cells, two figures on the top row and two on the bottom row.
    Do NOT line all four up in a single row, and do NOT make some figures large and others small.
    The four views are: top-left = front, top-right = left side, bottom-left =
    three-quarter angle, bottom-right = back view. Stand in a strict T-pose with arms extended
    horizontally to the sides. Draw all four figures at the SAME scale and the SAME height, each one
    complete from head to feet inside its own cell — never let a figure cross into another cell or run
    off the edge of the sheet. Keep NATURAL, REALISTIC proportions — normal head-to-body ratio, do NOT
    elongate, stretch or squash; identical height and build in all four panels. Exactly ONE character
    standing alone in each panel, framed head-to-feet with a small even margin. Sample the skin tone and
    all colors directly from the reference. ABSOLUTELY NO text, letters, words, numbers, captions, labels
    or watermarks anywhere (do NOT write FRONT, LEFT, BACK). NO borders, frames, outlines, grid lines,
    dividers or gutters — the four views sit separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF)
    background. COPY, not create.

  hair: >
    COPY the exact hairstyle from the reference image as an isolated hairpiece on an invisible head,
    like a helmet made of hair — keep the same length, style and color as in the reference. Show it on
    a 2×2 grid in four views:
    top-left = front, top-right = left side, bottom-left = three-quarter angle, bottom-right = back.
    Keep the hair's natural shape and proportions — do NOT stretch or distort it. The hollow inside of
    the hair is PURE WHITE — no face, no neck, no black shadow. Sample the hair color directly from the
    reference image. ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks
    anywhere. NO borders, frames, outlines, grid lines, dividers or gutters — the four views sit
    separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background. COPY, not create.

  face: >
    COPY the exact face features (eyes, nose, mouth, skin tone, facial structure) of the character
    exactly as shown in the reference image — same gender, age and skin tone — onto a 2×2 grid in four views:
    top-left = front, top-right = left side, bottom-left = three-quarter angle, bottom-right = back.
    Show the facial features and head contour ONLY — NO hair on top of head (bald scalp silhouette),
    NO shoulders, NO neck, NO body. Keep natural, realistic facial proportions — do NOT stretch or
    distort the head. ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks
    anywhere. NO borders, frames, outlines, grid lines, dividers or gutters — the four views sit
    separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background. COPY, not create.

  body: >
    COPY the exact face, hairstyle, skin tone and body shape from the reference image as a CLEAN
    STYLIZED 3D CHARACTER BASE MESH (like a smooth toy figure / animation base model) onto a 2×2 grid
    in four views: top-left = front, top-right = left side, bottom-left = three-quarter angle,
    bottom-right = back. Pixar / stylized animated cartoon look. The upper body has NO shirt and NO top,
    rendered as a completely SMOOTH, FEATURELESS, DOLL-LIKE surface with NO anatomical detail whatsoever
    (like a plastic mannequin or action figure) — fully non-explicit and child-safe. The figure wears
    ONLY plain grey shorts and is barefoot; NO jacket, NO other garments. Keep NATURAL, REALISTIC
    proportions — do NOT elongate, stretch or squash; identical height and build in all four panels.
    Exactly ONE body standing in a T-pose in each panel. ABSOLUTELY NO text, letters, words, numbers,
    captions, labels or watermarks anywhere. NO borders, frames, outlines, grid lines, dividers or
    gutters — the four views sit separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background. COPY skin
    tone directly from the reference.

  jacket: >
    Sleeves stretched straight out horizontally forming a letter T, NOT hanging down. COPY the exact
    jacket/top garment from the reference image as a ghost mannequin flat lay — IGNORE the person,
    reproduce ONLY the jacket. Show on a 2×2 grid in four views: top-left = front, top-right = left
    side, bottom-left = three-quarter angle, bottom-right = back. Keep the garment's natural shape and
    proportions — do NOT stretch or distort it; the same garment in all panels. ABSOLUTELY NO text,
    letters, words, numbers, captions, labels or watermarks anywhere. NO borders, frames, outlines,
    grid lines, dividers or gutters — the four views sit separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white
    (#FFFFFF) background. COPY, not create.

  pants: >
    COPY the exact pants/lower garment from the reference image as a ghost mannequin flat lay —
    IGNORE the person, reproduce ONLY the pants. EXACTLY ONE single pair of pants per panel — never
    two pairs, never duplicated legs side by side; one garment only, shown from the stated angle.
    Show on a 2×2 grid in four views: top-left = front, top-right = left side, bottom-left =
    three-quarter angle, bottom-right = back. Keep the garment's natural shape and proportions — do
    NOT stretch or distort it; the same single garment in all four panels. ABSOLUTELY NO text, letters,
    words, numbers, captions, labels or watermarks anywhere. NO borders, frames, outlines, grid lines,
    dividers or gutters — the four views sit separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF)
    background. COPY, not create.

  shoe: >
    COPY the exact shoe/footwear from the reference image. Show EXACTLY ONE single shoe per panel —
    ONE shoe only, NOT a pair, never two shoes side by side. Show that one shoe on a 2×2 grid in four
    views: top-left = front, top-right = left side, bottom-left = three-quarter angle, bottom-right =
    back. Keep the footwear's natural shape and proportions — do NOT stretch or distort it; the same
    single shoe in all four panels. ABSOLUTELY NO text, letters, words, numbers, captions, labels or
    watermarks anywhere. NO borders, frames, outlines, grid lines, dividers or gutters — the four views
    sit separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background. COPY, not create.

  goggles: >
    Show stylish modern protective goggles / sunglasses on a 2×2 grid in four views: top-left = front,
    top-right = left side, bottom-left = three-quarter angle, bottom-right = back. If character wears
    goggles in reference image, COPY them; otherwise design matching modern futuristic goggles. Keep
    natural, realistic proportions — do NOT stretch or distort. NO face or head, isolated eyewear only.
    ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks anywhere. NO borders,
    frames, outlines, grid lines, dividers or gutters — the four views sit separated by clear empty white space (never touching or overlapping) on ONE seamless
    pure-white (#FFFFFF) background.

  headphone: >
    Show stylish modern over-ear wireless headphones on a 2×2 grid in four views: top-left = front,
    top-right = left side, bottom-left = three-quarter angle, bottom-right = back. If character wears
    headphones in reference image, COPY them; otherwise design matching modern headphones. Keep natural,
    realistic proportions — do NOT stretch or distort. NO head or ears, isolated headphones only.
    ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks anywhere. NO borders,
    frames, outlines, grid lines, dividers or gutters — the four views sit separated by clear empty white space (never touching or overlapping) on ONE seamless
    pure-white (#FFFFFF) background.

  watch: >
    COPY the exact wristwatch / smartwatch from the reference image as an isolated single accessory.
    Show ONE watch on a 2×2 grid in four views: top-left = front (dial facing viewer), top-right = left
    side, bottom-left = three-quarter angle, bottom-right = back (strap/clasp). If the character wears a
    watch in the reference, COPY it; otherwise design a matching modern smartwatch. Keep natural,
    realistic proportions — do NOT stretch or distort. NO hand, wrist or arm — isolated watch only.
    ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks anywhere. NO borders,
    frames, outlines, grid lines, dividers or gutters — the four views sit separated by clear empty white space (never touching or overlapping) on ONE seamless
    pure-white (#FFFFFF) background.


# ---------------------------------------------------------------------------
