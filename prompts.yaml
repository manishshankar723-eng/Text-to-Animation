# =============================================================================
# CHARACTER ASSET GENERATION — GEMINI PROMPTS
# =============================================================================
# HOW TO USE:
#   - {age}, {gender}, {skin_tone} placeholders are used in fullbody, hair, face only.
#   - These are filled at runtime from the character template config below.
#   - All other part prompts are generic (no character-specific placeholders).
#
# HOW TO CUSTOMIZE:
#   - Replace the prompt text below with your own tuned prompts.
#   - Keep the YAML key names exactly as they are.
#   - The pipeline reads these keys to decide which Gemini calls to make.
#
# PROMPT RULES (applied in every prompt below):
#   1. Position = priority. The MOST important instruction is the FIRST sentence.
#   2. "COPY, not create" — preserves identity from the reference image.
#   3. Positive phrasing — describe what you WANT, not long NO-lists.
#   4. Every prompt states: 2×2 grid, four views, pure white background.
#   5. Age and gender stated clearly (in character-specific prompts).
# =============================================================================

# ---------------------------------------------------------------------------
# DEFAULT PROMPTS — used when no template override exists for a part.
# These are DRAFT prompts based on the prompt rules. Replace with your
# own tuned prompts. The pipeline will use these as-is until you do.
# ---------------------------------------------------------------------------
defaults:

  fullbody: >
    COPY this exact character EXACTLY as shown in the reference image — keep the SAME gender/sex, age,
    face, hairstyle, body type, outfit and skin tone. Do NOT change their identity, gender or age; if
    the reference is a woman keep her a woman, if a man keep him a man. Lay the sheet out as EXACTLY
    TWO ROWS and TWO COLUMNS — four equal cells, two figures on the top row and two on the bottom row.
    Do NOT line all four up in a single row, and do NOT make some figures large and others small.
    The four views are: top-left = front, top-right = left side, bottom-left =
    three-quarter angle, bottom-right = back view. Stand in a strict T-pose with arms extended
    horizontally to the sides. Draw all four figures at the SAME scale and the SAME height, each one
    complete from head to feet inside its own cell — never let a figure cross into another cell or run
    off the edge of the sheet. Keep NATURAL, REALISTIC proportions — normal head-to-body ratio, do NOT
    elongate, stretch or squash; identical height and build in all four panels. Exactly ONE character
    standing alone in each panel, framed head-to-feet with a small even margin. Sample the skin tone and
    all colors directly from the reference. ABSOLUTELY NO text, letters, words, numbers, captions, labels
    or watermarks anywhere (do NOT write FRONT, LEFT, BACK). NO borders, frames, outlines, grid lines,
    dividers or gutters — the four views sit separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF)
    background. COPY, not create.

  hair: >
    COPY the exact hairstyle from the reference image as an isolated hairpiece on an invisible head,
    like a helmet made of hair — keep the same length, style and color as in the reference. Show it on
    a 2×2 grid in four views:
    top-left = front, top-right = left side, bottom-left = three-quarter angle, bottom-right = back.
    Keep the hair's natural shape and proportions — do NOT stretch or distort it. The hollow inside of
    the hair is PURE WHITE — no face, no neck, no black shadow. Sample the hair color directly from the
    reference image. ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks
    anywhere. NO borders, frames, outlines, grid lines, dividers or gutters — the four views sit
    separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background. COPY, not create.

  face: >
    COPY the exact face features (eyes, nose, mouth, skin tone, facial structure) of the character
    exactly as shown in the reference image — same gender, age and skin tone — onto a 2×2 grid in four views:
    top-left = front, top-right = left side, bottom-left = three-quarter angle, bottom-right = back.
    Show the facial features and head contour ONLY — NO hair on top of head (bald scalp silhouette),
    NO shoulders, NO neck, NO body. Keep natural, realistic facial proportions — do NOT stretch or
    distort the head. ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks
    anywhere. NO borders, frames, outlines, grid lines, dividers or gutters — the four views sit
    separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background. COPY, not create.

  body: >
    COPY the exact face, hairstyle, skin tone and body shape from the reference image as a CLEAN
    STYLIZED 3D CHARACTER BASE MESH (like a smooth toy figure / animation base model) onto a 2×2 grid
    in four views: top-left = front, top-right = left side, bottom-left = three-quarter angle,
    bottom-right = back. Pixar / stylized animated cartoon look. The upper body has NO shirt and NO top,
    rendered as a completely SMOOTH, FEATURELESS, DOLL-LIKE surface with NO anatomical detail whatsoever
    (like a plastic mannequin or action figure) — fully non-explicit and child-safe. The figure wears
    ONLY plain grey shorts and is barefoot; NO jacket, NO other garments. Keep NATURAL, REALISTIC
    proportions — do NOT elongate, stretch or squash; identical height and build in all four panels.
    Exactly ONE body standing in a T-pose in each panel. ABSOLUTELY NO text, letters, words, numbers,
    captions, labels or watermarks anywhere. NO borders, frames, outlines, grid lines, dividers or
    gutters — the four views sit separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background. COPY skin
    tone directly from the reference.

  jacket: >
    Sleeves stretched straight out horizontally forming a letter T, NOT hanging down. COPY the exact
    jacket/top garment from the reference image as a ghost mannequin flat lay — IGNORE the person,
    reproduce ONLY the jacket. Show on a 2×2 grid in four views: top-left = front, top-right = left
    side, bottom-left = three-quarter angle, bottom-right = back. Keep the garment's natural shape and
    proportions — do NOT stretch or distort it; the same garment in all panels. ABSOLUTELY NO text,
    letters, words, numbers, captions, labels or watermarks anywhere. NO borders, frames, outlines,
    grid lines, dividers or gutters — the four views sit separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white
    (#FFFFFF) background. COPY, not create.

  pants: >
    COPY the exact pants/lower garment from the reference image as a ghost mannequin flat lay —
    IGNORE the person, reproduce ONLY the pants. EXACTLY ONE single pair of pants per panel — never
    two pairs, never duplicated legs side by side; one garment only, shown from the stated angle.
    Show on a 2×2 grid in four views: top-left = front, top-right = left side, bottom-left =
    three-quarter angle, bottom-right = back. Keep the garment's natural shape and proportions — do
    NOT stretch or distort it; the same single garment in all four panels. ABSOLUTELY NO text, letters,
    words, numbers, captions, labels or watermarks anywhere. NO borders, frames, outlines, grid lines,
    dividers or gutters — the four views sit separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF)
    background. COPY, not create.

  shoe: >
    COPY the exact shoe/footwear from the reference image. Show EXACTLY ONE single shoe per panel —
    ONE shoe only, NOT a pair, never two shoes side by side. Show that one shoe on a 2×2 grid in four
    views: top-left = front, top-right = left side, bottom-left = three-quarter angle, bottom-right =
    back. Keep the footwear's natural shape and proportions — do NOT stretch or distort it; the same
    single shoe in all four panels. ABSOLUTELY NO text, letters, words, numbers, captions, labels or
    watermarks anywhere. NO borders, frames, outlines, grid lines, dividers or gutters — the four views
    sit separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background. COPY, not create.

  goggles: >
    Show stylish modern protective goggles / sunglasses on a 2×2 grid in four views: top-left = front,
    top-right = left side, bottom-left = three-quarter angle, bottom-right = back. If character wears
    goggles in reference image, COPY them; otherwise design matching modern futuristic goggles. Keep
    natural, realistic proportions — do NOT stretch or distort. NO face or head, isolated eyewear only.
    ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks anywhere. NO borders,
    frames, outlines, grid lines, dividers or gutters — the four views sit separated by clear empty white space (never touching or overlapping) on ONE seamless
    pure-white (#FFFFFF) background.

  headphone: >
    Show stylish modern over-ear wireless headphones on a 2×2 grid in four views: top-left = front,
    top-right = left side, bottom-left = three-quarter angle, bottom-right = back. If character wears
    headphones in reference image, COPY them; otherwise design matching modern headphones. Keep natural,
    realistic proportions — do NOT stretch or distort. NO head or ears, isolated headphones only.
    ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks anywhere. NO borders,
    frames, outlines, grid lines, dividers or gutters — the four views sit separated by clear empty white space (never touching or overlapping) on ONE seamless
    pure-white (#FFFFFF) background.

  watch: >
    COPY the exact wristwatch / smartwatch from the reference image as an isolated single accessory.
    Show ONE watch on a 2×2 grid in four views: top-left = front (dial facing viewer), top-right = left
    side, bottom-left = three-quarter angle, bottom-right = back (strap/clasp). If the character wears a
    watch in the reference, COPY it; otherwise design a matching modern smartwatch. Keep natural,
    realistic proportions — do NOT stretch or distort. NO hand, wrist or arm — isolated watch only.
    ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks anywhere. NO borders,
    frames, outlines, grid lines, dividers or gutters — the four views sit separated by clear empty white space (never touching or overlapping) on ONE seamless
    pure-white (#FFFFFF) background.


# ---------------------------------------------------------------------------
# SUBJECT-TYPE TEMPLATES
# Each template picks its own `parts_order` (which sections to generate) and can
# override any prompt. Human templates may use {age}/{gender}/{skin_tone}; other
# subjects (robot/animal/bird/…) omit them — missing placeholders resolve blank.
# `label` is the friendly name shown in the client dropdown.
# ---------------------------------------------------------------------------
templates:

  # --- DEFAULT: any human, gender/age/skin INFERRED from the reference image ---
  default:
    label: "Human — Auto (from reference)"
    character_defaults: {}
    slot_renames: {}
    parts_order: [fullbody, hair, face, body, jacket, pants, shoe, headphone, goggles, watch]
    prompts: {}

  # --- Human, forced MALE ---
  human_male:
    label: "Human — Male"
    character_defaults: {}
    slot_renames: {}
    parts_order: [fullbody, hair, face, body, jacket, pants, shoe, headphone, goggles, watch]
    prompts:
      fullbody: >
        COPY this character from the reference image as a MALE character with masculine build and
        features (keep his face, hairstyle, outfit and skin tone). Place him onto a 2×2 grid showing
        the FULL BODY in four views: top-left = front, top-right = left side, bottom-left =
        three-quarter angle, bottom-right = back. Strict T-pose, arms extended horizontally. Keep
        NATURAL, REALISTIC proportions — do NOT stretch or squash; identical in all four panels.
        Exactly ONE character per panel. ABSOLUTELY NO text, letters, captions, labels or watermarks.
        NO borders, frames, grid lines, dividers or gutters — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white
        (#FFFFFF) background. COPY, not create.
      face: >
        COPY the exact MALE face (eyes, nose, mouth, skin tone, facial structure) from the reference
        onto a 2×2 grid: top-left = front, top-right = left side, bottom-left = three-quarter,
        bottom-right = back. Head and facial features ONLY — bald scalp, NO shoulders, NO body.
        ABSOLUTELY NO text, captions, labels or watermarks. NO borders, frames, grid lines or dividers —
        separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background. COPY, not create.

  # --- Human, forced FEMALE ---
  human_female:
    label: "Human — Female"
    character_defaults: {}
    slot_renames: {}
    parts_order: [fullbody, hair, face, body, jacket, pants, shoe, headphone, goggles, watch]
    prompts:
      fullbody: >
        COPY this character from the reference image as a FEMALE character with feminine build and
        features (keep her face, hairstyle, outfit and skin tone). Place her onto a 2×2 grid showing
        the FULL BODY in four views: top-left = front, top-right = left side, bottom-left =
        three-quarter angle, bottom-right = back. Strict T-pose, arms extended horizontally. Keep
        NATURAL, REALISTIC proportions — do NOT stretch or squash; identical in all four panels.
        Exactly ONE character per panel. ABSOLUTELY NO text, letters, captions, labels or watermarks.
        NO borders, frames, grid lines, dividers or gutters — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white
        (#FFFFFF) background. COPY, not create.
      face: >
        COPY the exact FEMALE face (eyes, nose, mouth, skin tone, facial structure) from the reference
        onto a 2×2 grid: top-left = front, top-right = left side, bottom-left = three-quarter,
        bottom-right = back. Head and facial features ONLY — bald scalp, NO shoulders, NO body.
        ABSOLUTELY NO text, captions, labels or watermarks. NO borders, frames, grid lines or dividers —
        separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background. COPY, not create.

  # --- ROBOT / mecha / armored suit ---
  robot:
    label: "Robot / Mecha"
    character_defaults: {}
    slot_renames: {}
    parts_order: [fullbody, head, torso, arms, legs]
    prompts:
      fullbody: >
        COPY this exact robot / mecha / armored suit EXACTLY as shown in the reference image — same
        design, materials, plating, colors and glowing accents. NO human skin, NO hair, NO organic
        flesh. Full body standing upright, arms slightly out from the sides, onto a 2×2 grid: top-left =
        front, top-right = left side, bottom-left = three-quarter angle, bottom-right = back. EVERY panel
        must show the COMPLETE figure from the top of the head to the feet, fully inside the frame with a
        small even margin — NOTHING cropped or cut off, especially the three-quarter view. Keep NATURAL,
        realistic proportions — do NOT stretch or distort; identical in all four panels. Exactly ONE
        robot per panel. ABSOLUTELY NO text, letters, captions, labels or watermarks. NO borders, frames,
        grid lines, dividers or gutters — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background.
        COPY, not create.
      head: >
        COPY the robot's HEAD / helmet as an isolated part (no neck, no body) onto a 2×2 grid: top-left =
        front, top-right = left side, bottom-left = three-quarter, bottom-right = back. Same design and
        glowing accents as the reference. ABSOLUTELY NO text, captions, labels or watermarks. NO borders,
        frames, grid lines or dividers — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background.
      torso: >
        COPY ONLY the robot's central TORSO / chest plate as a single detached piece, floating alone in
        the middle of each panel. ABSOLUTELY NO arms, NO shoulders, NO head, NO neck, NO legs, NO limbs
        of any kind — just the chest/torso module by itself. Show it on a 2×2 grid: top-left = front,
        top-right = left side, bottom-left = three-quarter, bottom-right = back. Same design and glowing
        accents as the reference. ABSOLUTELY NO text, captions, labels or watermarks. NO borders, frames,
        grid lines or dividers — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background.
      arms: >
        COPY EXACTLY ONE single robot ARM (one limb only, from the shoulder joint down to the hand) as a
        detached piece floating alone in each panel. ONE arm only — NEVER two arms, NEVER a pair. NO
        chest, NO torso, NO body, NO shoulders plate, NO head, NO legs — just one isolated arm. Show that
        same single arm on a 2×2 grid: top-left = front, top-right = left side, bottom-left =
        three-quarter, bottom-right = back. ABSOLUTELY NO text, captions, labels or watermarks. NO
        borders, frames, grid lines or dividers — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF)
        background.
      legs: >
        COPY EXACTLY ONE single robot LEG (one limb only, from the hip joint down to the foot) as a
        detached piece floating alone in each panel. ONE leg only — NEVER two legs, NEVER a pair. NO
        torso, NO body, NO hips block, NO head, NO arms — just one isolated leg. Show that same single
        leg on a 2×2 grid: top-left = front, top-right = left side, bottom-left = three-quarter,
        bottom-right = back. ABSOLUTELY NO text, captions, labels or watermarks. NO borders, frames, grid
        lines or dividers — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background.

  # --- ANIMAL (four-legged creature) ---
  animal:
    label: "Animal"
    character_defaults: {}
    slot_renames: {}
    parts_order: [fullbody, head, body, legs, tail]
    prompts:
      fullbody: >
        COPY this exact animal EXACTLY as shown in the reference image — same species, fur/skin/scales,
        colors and markings. Full body in a natural standing side-on pose, onto a 2×2 grid: top-left =
        front, top-right = left side, bottom-left = three-quarter, bottom-right = back. Keep natural,
        realistic animal proportions — do NOT stretch or distort; identical in all four panels. Exactly
        ONE animal per panel. ABSOLUTELY NO text, captions, labels or watermarks. NO borders, frames,
        grid lines, dividers or gutters — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background.
      head: >
        COPY the animal's HEAD as an isolated part (no body) onto a 2×2 grid: front, left, three-quarter,
        back. Same fur, markings and features as the reference. ABSOLUTELY NO text, captions, labels or
        watermarks. NO borders, frames, grid lines or dividers — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white
        (#FFFFFF) background.
      body: >
        COPY the animal's BODY / torso (with its fur, markings and coloring, no head, no legs) onto a 2×2
        grid: front, left, three-quarter, back. ABSOLUTELY NO text, captions, labels or watermarks. NO
        borders, frames, grid lines or dividers — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF)
        background.
      legs: >
        COPY ONE of the animal's LEGS / paws as an isolated single part onto a 2×2 grid: front, left,
        three-quarter, back. One leg only. ABSOLUTELY NO text, captions, labels or watermarks. NO borders,
        frames, grid lines or dividers — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background.
      tail: >
        COPY the animal's TAIL as an isolated single part onto a 2×2 grid: front, left, three-quarter,
        back. ABSOLUTELY NO text, captions, labels or watermarks. NO borders, frames, grid lines or
        dividers — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background.

  # --- BIRD ---
  bird:
    label: "Bird"
    character_defaults: {}
    slot_renames: {}
    parts_order: [fullbody, head, wings, beak, feet, tail]
    prompts:
      fullbody: >
        COPY this exact bird EXACTLY as shown in the reference image — same species, plumage, colors and
        markings. Full body standing, onto a 2×2 grid: top-left = front, top-right = left side,
        bottom-left = three-quarter, bottom-right = back. Keep natural, realistic bird proportions — do
        NOT stretch or distort; identical in all four panels. Exactly ONE bird per panel. ABSOLUTELY NO
        text, captions, labels or watermarks. NO borders, frames, grid lines, dividers or gutters —
        separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background.
      head: >
        COPY the bird's HEAD as an isolated part (no body) onto a 2×2 grid: front, left, three-quarter,
        back. ABSOLUTELY NO text, captions, labels or watermarks. NO borders, frames, grid lines or
        dividers — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background.
      wings: >
        COPY ONE of the bird's WINGS, fully spread to show the feathers, as an isolated single part onto
        a 2×2 grid: front, left, three-quarter, back. One wing only. ABSOLUTELY NO text, captions, labels
        or watermarks. NO borders, frames, grid lines or dividers — separated by clear empty white space (never touching or overlapping) on ONE seamless
        pure-white (#FFFFFF) background.
      beak: >
        COPY the bird's BEAK as an isolated part onto a 2×2 grid: front, left, three-quarter, back.
        ABSOLUTELY NO text, captions, labels or watermarks. NO borders, frames, grid lines or dividers —
        separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background.
      feet: >
        COPY ONE of the bird's FEET / talons as an isolated single part onto a 2×2 grid: front, left,
        three-quarter, back. ABSOLUTELY NO text, captions, labels or watermarks. NO borders, frames, grid
        lines or dividers — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background.
      tail: >
        COPY the bird's TAIL feathers as an isolated part onto a 2×2 grid: front, left, three-quarter,
        back. ABSOLUTELY NO text, captions, labels or watermarks. NO borders, frames, grid lines or
        dividers — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background.

  # --- MONSTER / CREATURE (generic) ---
  monster:
    label: "Monster / Creature"
    character_defaults: {}
    slot_renames: {}
    parts_order: [fullbody, head, body, limbs]
    prompts:
      fullbody: >
        COPY this exact monster / creature EXACTLY as shown in the reference image — same anatomy, skin/
        scales/fur, colors, horns, spikes and features. Full body standing, onto a 2×2 grid: top-left =
        front, top-right = left side, bottom-left = three-quarter, bottom-right = back. Keep the
        creature's natural proportions — do NOT stretch or distort; identical in all four panels. Exactly
        ONE creature per panel. ABSOLUTELY NO text, captions, labels or watermarks. NO borders, frames,
        grid lines, dividers or gutters — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background.
      head: >
        COPY the creature's HEAD as an isolated part (no body) onto a 2×2 grid: front, left,
        three-quarter, back. ABSOLUTELY NO text, captions, labels or watermarks. NO borders, frames, grid
        lines or dividers — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background.
      body: >
        COPY the creature's BODY / torso (no head, no limbs) onto a 2×2 grid: front, left, three-quarter,
        back. ABSOLUTELY NO text, captions, labels or watermarks. NO borders, frames, grid lines or
        dividers — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background.
      limbs: >
        COPY ONE of the creature's LIMBS (arm, leg, tentacle or claw) as an isolated single part onto a
        2×2 grid: front, left, three-quarter, back. ABSOLUTELY NO text, captions, labels or watermarks.
        NO borders, frames, grid lines or dividers — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF)
        background.

  # --- GHOST / SPIRIT ---
  ghost:
    label: "Ghost / Spirit"
    character_defaults: {}
    slot_renames: {}
    parts_order: [fullbody]
    prompts:
      fullbody: >
        COPY this exact ghost / spirit EXACTLY as shown in the reference image — same translucent,
        ethereal, glowing form, colors and wispy shape. Full figure floating upright, onto a 2×2 grid:
        top-left = front, top-right = left side, bottom-left = three-quarter, bottom-right = back. Keep
        its natural proportions — do NOT stretch or distort; identical in all four panels. Exactly ONE
        ghost per panel. ABSOLUTELY NO text, captions, labels or watermarks. NO borders, frames, grid
        lines, dividers or gutters — separated by clear empty white space (never touching or overlapping) on ONE seamless pure-white (#FFFFFF) background.


# ---------------------------------------------------------------------------
# GLOBAL PARTS LIST — fallback order when a template doesn't define its own.
# The pipeline iterates this list. "fullbody" is always first (Stage 1).
# The rest are Stage 2 (each uses the fullbody sheet as reference).
# ---------------------------------------------------------------------------
parts_order:
  - fullbody
  - hair
  - face
  - body
  - jacket
  - pants
  - shoe
  - headphone
  - goggles
  - watch
