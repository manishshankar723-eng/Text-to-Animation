# =============================================================================
# CHARACTER ASSET GENERATION — GEMINI PROMPTS
# =============================================================================
# HOW TO USE:
#   - {age}, {gender}, {skin_tone} placeholders are used in fullbody, hair, face only.
#   - These are filled at runtime from the character template config below.
#   - All other part prompts are generic (no character-specific placeholders).
#
# HOW TO CUSTOMIZE:
#   - Replace the prompt text below with your own tuned prompts.
#   - Keep the YAML key names exactly as they are.
#   - The pipeline reads these keys to decide which Gemini calls to make.
#
# PROMPT RULES (applied in every prompt below):
#   1. Position = priority. The MOST important instruction is the FIRST sentence.
#   2. "COPY, not create" — preserves identity from the reference image.
#   3. Positive phrasing — describe what you WANT, not long NO-lists.
#   4. Every prompt states: 2×2 grid, four views, pure white background.
#   5. Age and gender stated clearly (in character-specific prompts).
# =============================================================================

# ---------------------------------------------------------------------------
# DEFAULT PROMPTS — used when no template override exists for a part.
# These are DRAFT prompts based on the prompt rules. Replace with your
# own tuned prompts. The pipeline will use these as-is until you do.
# ---------------------------------------------------------------------------
defaults:

  fullbody: >
    COPY this exact {gender} character (age {age}, {skin_tone} skin) from the reference image onto
    a 2×2 grid showing the FULL BODY in four views: top-left = front, top-right = left side,
    bottom-left = three-quarter angle, bottom-right = back view. Stand in a strict T-pose with arms
    extended horizontally to the sides. Keep NATURAL, REALISTIC human proportions — normal head-to-body
    ratio, do NOT elongate, stretch or squash the figure; the same figure must be identical height and
    build in all four panels. Exactly ONE character standing alone in each panel, framed head-to-feet
    with a small even margin. Sample the skin tone and all colors directly from the reference image.
    ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks anywhere (do NOT write
    FRONT, LEFT, BACK). NO borders, frames, outlines, grid lines, dividers or gutters — the four views
    sit edge-to-edge on ONE seamless pure-white (#FFFFFF) background. COPY, not create.

  hair: >
    COPY the exact hairstyle from the reference image as an isolated hairpiece on an invisible head,
    like a helmet made of hair. {gender} character, age {age}. Show it on a 2×2 grid in four views:
    top-left = front, top-right = left side, bottom-left = three-quarter angle, bottom-right = back.
    Keep the hair's natural shape and proportions — do NOT stretch or distort it. The hollow inside of
    the hair is PURE WHITE — no face, no neck, no black shadow. Sample the hair color directly from the
    reference image. ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks
    anywhere. NO borders, frames, outlines, grid lines, dividers or gutters — the four views sit
    edge-to-edge on ONE seamless pure-white (#FFFFFF) background. COPY, not create.

  face: >
    COPY the exact face features (eyes, nose, mouth, skin tone, facial structure) of this {gender}
    character (age {age}, {skin_tone} skin) from the reference image onto a 2×2 grid in four views:
    top-left = front, top-right = left side, bottom-left = three-quarter angle, bottom-right = back.
    Show the facial features and head contour ONLY — NO hair on top of head (bald scalp silhouette),
    NO shoulders, NO neck, NO body. Keep natural, realistic facial proportions — do NOT stretch or
    distort the head. ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks
    anywhere. NO borders, frames, outlines, grid lines, dividers or gutters — the four views sit
    edge-to-edge on ONE seamless pure-white (#FFFFFF) background. COPY, not create.

  body: >
    COPY the exact body shape and skin tone from the reference image as a CLEAN BASE BODY onto a 2×2
    grid in four views: top-left = front, top-right = left side, bottom-left = three-quarter angle,
    bottom-right = back. Show a bare shirtless torso wearing ONLY plain fitted grey shorts — NO shirt,
    NO jacket, NO garments on the upper body, minimal plain footwear or bare feet. Match the same art
    style, face and hairstyle as the reference. Keep NATURAL, REALISTIC human proportions — do NOT
    elongate, stretch or squash the figure; identical height and build in all four panels. Exactly ONE
    body standing in a T-pose in each panel. ABSOLUTELY NO text, letters, words, numbers, captions,
    labels or watermarks anywhere. NO borders, frames, outlines, grid lines, dividers or gutters — the
    four views sit edge-to-edge on ONE seamless pure-white (#FFFFFF) background. COPY skin tone directly
    from the reference.

  jacket: >
    Sleeves stretched straight out horizontally forming a letter T, NOT hanging down. COPY the exact
    jacket/top garment from the reference image as a ghost mannequin flat lay — IGNORE the person,
    reproduce ONLY the jacket. Show on a 2×2 grid in four views: top-left = front, top-right = left
    side, bottom-left = three-quarter angle, bottom-right = back. Keep the garment's natural shape and
    proportions — do NOT stretch or distort it; the same garment in all panels. ABSOLUTELY NO text,
    letters, words, numbers, captions, labels or watermarks anywhere. NO borders, frames, outlines,
    grid lines, dividers or gutters — the four views sit edge-to-edge on ONE seamless pure-white
    (#FFFFFF) background. COPY, not create.

  pants: >
    COPY the exact pants/lower garment from the reference image as a ghost mannequin flat lay —
    IGNORE the person, reproduce ONLY the pants. EXACTLY ONE single pair of pants per panel — never
    two pairs, never duplicated legs side by side; one garment only, shown from the stated angle.
    Show on a 2×2 grid in four views: top-left = front, top-right = left side, bottom-left =
    three-quarter angle, bottom-right = back. Keep the garment's natural shape and proportions — do
    NOT stretch or distort it; the same single garment in all four panels. ABSOLUTELY NO text, letters,
    words, numbers, captions, labels or watermarks anywhere. NO borders, frames, outlines, grid lines,
    dividers or gutters — the four views sit edge-to-edge on ONE seamless pure-white (#FFFFFF)
    background. COPY, not create.

  shoe: >
    COPY the exact shoe/footwear from the reference image. Show EXACTLY ONE single shoe per panel —
    ONE shoe only, NOT a pair, never two shoes side by side. Show that one shoe on a 2×2 grid in four
    views: top-left = front, top-right = left side, bottom-left = three-quarter angle, bottom-right =
    back. Keep the footwear's natural shape and proportions — do NOT stretch or distort it; the same
    single shoe in all four panels. ABSOLUTELY NO text, letters, words, numbers, captions, labels or
    watermarks anywhere. NO borders, frames, outlines, grid lines, dividers or gutters — the four views
    sit edge-to-edge on ONE seamless pure-white (#FFFFFF) background. COPY, not create.

  goggles: >
    Show stylish modern protective goggles / sunglasses on a 2×2 grid in four views: top-left = front,
    top-right = left side, bottom-left = three-quarter angle, bottom-right = back. If character wears
    goggles in reference image, COPY them; otherwise design matching modern futuristic goggles. Keep
    natural, realistic proportions — do NOT stretch or distort. NO face or head, isolated eyewear only.
    ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks anywhere. NO borders,
    frames, outlines, grid lines, dividers or gutters — the four views sit edge-to-edge on ONE seamless
    pure-white (#FFFFFF) background.

  headphone: >
    Show stylish modern over-ear wireless headphones on a 2×2 grid in four views: top-left = front,
    top-right = left side, bottom-left = three-quarter angle, bottom-right = back. If character wears
    headphones in reference image, COPY them; otherwise design matching modern headphones. Keep natural,
    realistic proportions — do NOT stretch or distort. NO head or ears, isolated headphones only.
    ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks anywhere. NO borders,
    frames, outlines, grid lines, dividers or gutters — the four views sit edge-to-edge on ONE seamless
    pure-white (#FFFFFF) background.

  watch: >
    COPY the exact wristwatch / smartwatch from the reference image as an isolated single accessory.
    Show ONE watch on a 2×2 grid in four views: top-left = front (dial facing viewer), top-right = left
    side, bottom-left = three-quarter angle, bottom-right = back (strap/clasp). If the character wears a
    watch in the reference, COPY it; otherwise design a matching modern smartwatch. Keep natural,
    realistic proportions — do NOT stretch or distort. NO hand, wrist or arm — isolated watch only.
    ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks anywhere. NO borders,
    frames, outlines, grid lines, dividers or gutters — the four views sit edge-to-edge on ONE seamless
    pure-white (#FFFFFF) background.


# ---------------------------------------------------------------------------
# CHARACTER TEMPLATES — override specific parts for different character types.
# Only fullbody, hair, and face use {age}, {gender}, {skin_tone} placeholders.
# Other parts use slot_renames to change output filenames.
# ---------------------------------------------------------------------------
templates:

  # --- DEFAULT template (no overrides needed, uses all defaults above) ---
  default:
    character_defaults:
      age: "25"
      gender: "male"
      skin_tone: "medium brown"
    slot_renames: {}
    prompts: {}

  # --- SAREE template ---
  saree:
    character_defaults:
      age: "30"
      gender: "female"
      skin_tone: "medium brown"

    # Renames: the "jacket" slot outputs as "saree", "pants" slot outputs as "blouse"
    slot_renames:
      jacket: saree
      pants: blouse

    # Override prompts for saree-specific parts
    prompts:

      fullbody: >
        COPY this exact {gender} character (age {age}, {skin_tone} skin) wearing a traditional
        saree from the reference image onto a 2×2 grid showing the FULL BODY in four views:
        top-left = front, top-right = left side, bottom-left = three-quarter angle, bottom-right =
        back view. Keep NATURAL, REALISTIC human proportions — normal head-to-body ratio, do NOT
        elongate, stretch or squash the figure; identical height and build in all four panels.
        Sample the skin tone, saree color, and all details directly from the reference image.
        ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks anywhere. NO
        borders, frames, outlines, grid lines, dividers or gutters — the four views sit edge-to-edge
        on ONE seamless pure-white (#FFFFFF) background. COPY, not create.

      hair: >
        COPY the exact hairstyle from the reference image as an isolated hairpiece on an invisible
        head, like a helmet made of hair. {gender} character, age {age}. Show on a 2×2 grid in
        four views: top-left = front, top-right = left side, bottom-left = three-quarter angle,
        bottom-right = back. Keep the hair's natural shape and proportions — do NOT stretch or
        distort it. The hollow inside of the hair is PURE WHITE — no black area, no dark shadow.
        Sample the hair color directly from the reference image. No sunglasses, no headphones, no
        accessories on the hair. ABSOLUTELY NO text, letters, words, numbers, captions, labels or
        watermarks anywhere. NO borders, frames, outlines, grid lines, dividers or gutters — the four
        views sit edge-to-edge on ONE seamless pure-white (#FFFFFF) background. COPY, not create.

      face: >
        COPY the exact face of this {gender} character (age {age}, {skin_tone} skin) from the
        reference image. Show the face and head only on a 2×2 grid in four views: top-left = front,
        top-right = left side, bottom-left = three-quarter angle, bottom-right = back. Include the
        bindi if present in the reference. Keep natural, realistic facial proportions — do NOT stretch
        or distort the head. Sample the skin tone directly from the reference image. Remove any
        sunglasses. ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks
        anywhere. NO borders, frames, outlines, grid lines, dividers or gutters — the four views sit
        edge-to-edge on ONE seamless pure-white (#FFFFFF) background. COPY, not create.

      jacket: >
        COMPLETE FULL-LENGTH saree, shoulder to ankles, zoom OUT so the ENTIRE saree fits
        top-to-bottom in each panel, nothing cut off. COPY the exact saree from the reference image
        as a ghost mannequin display — IGNORE the person, reproduce ONLY the draped saree fabric.
        Show on a 2×2 grid in four views: top-left = front, top-right = left side, bottom-left =
        three-quarter angle, bottom-right = back. Keep the saree's natural drape and proportions — do
        NOT stretch or distort it; the same saree in all four panels. Sample colors directly from the
        reference image. ABSOLUTELY NO text, letters, words, numbers, captions, labels or watermarks
        anywhere. NO borders, frames, outlines, grid lines, dividers or gutters — the four views sit
        edge-to-edge on ONE seamless pure-white (#FFFFFF) background. COPY, not create.

      pants: >
        SAREE BLOUSE / choli, short cropped, HALF SLEEVES ending mid-upper-arm (not full sleeves,
        not sleeveless). COPY the exact saree blouse from the reference image as a ghost mannequin
        display. Show on a 2×2 grid in four views: top-left = front, top-right = left side,
        bottom-left = three-quarter angle, bottom-right = back. Keep the blouse's natural shape and
        proportions — do NOT stretch or distort it; the same blouse in all four panels. Sample colors
        directly from the reference image. ABSOLUTELY NO text, letters, words, numbers, captions,
        labels or watermarks anywhere. NO borders, frames, outlines, grid lines, dividers or gutters —
        the four views sit edge-to-edge on ONE seamless pure-white (#FFFFFF) background. COPY, not create.

      shoe: >
        COPY the exact footwear from the reference image. V-strap flip-flop, single strap between
        big toe and second toe, Hawaii chappal / thong slipper style, NOT strappy, NOT buckled,
        NOT closed shoes. Show on a 2×2 grid in four views: top-left = front, top-right = left side,
        bottom-left = three-quarter angle, bottom-right = back. Keep the footwear's natural shape and
        proportions — do NOT stretch or distort it; the same footwear in all four panels. ABSOLUTELY
        NO text, letters, words, numbers, captions, labels or watermarks anywhere. NO borders, frames,
        outlines, grid lines, dividers or gutters — the four views sit edge-to-edge on ONE seamless
        pure-white (#FFFFFF) background. COPY, not create.


# ---------------------------------------------------------------------------
# PARTS LIST — the standard ordered list of parts to generate.
# The pipeline iterates this list. "fullbody" is always first (Stage 1).
# The rest are Stage 2 (each uses the fullbody sheet as reference).
# ---------------------------------------------------------------------------
parts_order:
  - fullbody
  - hair
  - face
  - body
  - jacket
  - pants
  - shoe
  - headphone
  - goggles
  - watch
