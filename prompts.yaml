# override any prompt. Human templates may use {age}/{gender}/{skin_tone}; other
# subjects (robot/animal/bird/…) omit them — missing placeholders resolve blank.
# `label` is the friendly name shown in the client dropdown.
# ---------------------------------------------------------------------------
templates:

  # --- DEFAULT: any human, gender/age/skin INFERRED from the reference image ---
  default:
    label: "Human — Auto (from reference)"
    character_defaults: {}
    slot_renames: {}
    parts_order: [fullbody, hair, face, body, jacket, pants, shoe, headphone, goggles, watch]
    prompts: {}

